<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Trayectoria Parabólica</title>
    <!-- Importamos Plotly para los gráficos -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        /* Estilos generales "Dark Mode" */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00E5FF;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaaaaa;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }
        
        /* Contenedor principal */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }

        /* Panel de controles */
        .controls {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }
        label span {
            color: #00E5FF;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #00E5FF;
        }

        /* Panel de Métricas */
        .metrics {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .metric {
            text-align: center;
        }
        .metric-value {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: #FF3366;
        }
        .metric-label {
            font-size: 0.8rem;
            color: #888;
        }

        /* Contenedor del gráfico */
        .chart-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            flex-grow: 1;
            min-width: 300px;
            height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>🚀 Simulador de Trayectoria Parabólica</h1>
    <p class="subtitle">Ajusta los parámetros para visualizar la simulación</p>

    <div class="container">
        <!-- Controles -->
        <div class="controls">
            <div class="control-group">
                <label>Velocidad (m/s) <span id="v0-val">30</span></label>
                <input type="range" id="v0" min="1" max="100" value="30" step="1">
            </div>
            <div class="control-group">
                <label>Ángulo (°) <span id="ang-val">45</span></label>
                <input type="range" id="angulo" min="0" max="90" value="45" step="1">
            </div>
            <div class="control-group">
                <label>Altura Inicial (m) <span id="h0-val">0</span></label>
                <input type="range" id="h0" min="0" max="50" value="0" step="1">
            </div>

            <div class="metrics">
                <div class="metric">
                    <span class="metric-value" id="t-vuelo">0</span>
                    <span class="metric-label">Tiempo (s)</span>
                </div>
                <div class="metric">
                    <span class="metric-value" id="h-max">0</span>
                    <span class="metric-label">Alt. Máx (m)</span>
                </div>
                <div class="metric">
                    <span class="metric-value" id="x-max">0</span>
                    <span class="metric-label">Alcance (m)</span>
                </div>
            </div>
        </div>

        <!-- Gráfico -->
        <div id="plot" class="chart-container"></div>
    </div>

    <script>
        // Elementos del DOM
        const inputs = {
            v0: document.getElementById('v0'),
            angulo: document.getElementById('angulo'),
            h0: document.getElementById('h0')
        };

        const displays = {
            v0: document.getElementById('v0-val'),
            angulo: document.getElementById('ang-val'),
            h0: document.getElementById('h0-val'),
            t_vuelo: document.getElementById('t-vuelo'),
            h_max: document.getElementById('h-max'),
            x_max: document.getElementById('x-max')
        };

        // Función principal de simulación
        function updateSimulation() {
            // Leer valores
            const v0 = parseFloat(inputs.v0.value);
            const angulo = parseFloat(inputs.angulo.value);
            const h0 = parseFloat(inputs.h0.value);
            
            // Actualizar etiquetas de los sliders
            displays.v0.textContent = v0;
            displays.angulo.textContent = angulo;
            displays.h0.textContent = h0;

            // Física
            const g = 9.81;
            const theta = angulo * Math.PI / 180;
            const v0x = v0 * Math.cos(theta);
            const v0y = v0 * Math.sin(theta);

            // Tiempo de vuelo
            const t_vuelo = (v0y + Math.sqrt(Math.pow(v0y, 2) + 2 * g * h0)) / g;
            
            // Generar arrays de datos
            const x = [];
            const y = [];
            const numPoints = 100;
            
            for (let i = 0; i <= numPoints; i++) {
                const t = (i / numPoints) * t_vuelo;
                x.push(v0x * t);
                y.push(h0 + (v0y * t) - (0.5 * g * Math.pow(t, 2)));
            }

            const h_max = Math.max(...y);
            const x_max = Math.max(...x);

            // Actualizar métricas
            displays.t_vuelo.textContent = t_vuelo.toFixed(2);
            displays.h_max.textContent = h_max.toFixed(1);
            displays.x_max.textContent = x_max.toFixed(1);

            // Datos de la trayectoria
            const trace = {
                x: x,
                y: y,
                mode: 'lines',
                name: 'Trayectoria',
                line: { color: '#00E5FF', width: 4, shape: 'spline' },
                hovertemplate: 'Distancia: %{x:.1f} m<br>Altura: %{y:.1f} m<extra></extra>'
            };

            // Puntos de inicio y fin
            const points = {
                x: [x[0], x[x.length - 1]],
                y: [y[0], y[y.length - 1]],
                mode: 'markers',
                name: 'Inicio/Fin',
                marker: { color: '#FF3366', size: 10, line: { color: 'white', width: 2 } }
            };

            // Suelo
            const ground = {
                x: [0, x_max * 1.1 || 10],
                y: [0, 0],
                mode: 'lines',
                name: 'Suelo',
                line: { color: 'gray', width: 2, dash: 'dash' }
            };

            const layout = {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#ffffff' },
                xaxis: { 
                    title: 'Distancia horizontal (m)', 
                    gridcolor: '#333',
                    zerolinecolor: '#666'
                },
                yaxis: { 
                    title: 'Altura (m)', 
                    gridcolor: '#333',
                    zerolinecolor: '#666',
                    range: [0, Math.max(h_max * 1.2, 10)]
                },
                hovermode: 'x unified',
                margin: { l: 50, r: 20, t: 20, b: 50 }
            };

            // Dibujar en Plotly
            Plotly.react('plot', [trace, points, ground], layout, {responsive: true});
        }

        // Escuchar cambios en los sliders
        inputs.v0.addEventListener('input', updateSimulation);
        inputs.angulo.addEventListener('input', updateSimulation);
        inputs.h0.addEventListener('input', updateSimulation);

        // Iniciar simulación al cargar la página
        updateSimulation();
    </script>
</body>
</html>
